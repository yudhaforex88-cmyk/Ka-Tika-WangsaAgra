<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Ka-Tika Digital Calendar</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <main class="app" data-gesture>
      <section class="card header-main">
        <div class="row-between">
          <p data-date class="muted">-</p>
          <button class="btn" data-theme-toggle type="button" style="max-width: 110px">☀️ Light</button>
        </div>
        <h1 data-saptawara>REDITE</h1>
      </section>

      <section class="card pair">
        <div>
          <h2>Triwara</h2>
          <p data-triwara>Kajeng</p>
        </div>
        <div>
          <h2>Pancawara</h2>
          <p data-pancawara>Paing</p>
        </div>
      </section>

      <section class="card split">
        <div>
          <h2 class="muted">Sasih</h2>
          <p data-sasih>Kasa</p>
        </div>
        <div>
          <h2 class="muted">Wuku</h2>
          <p data-wuku>Sinta</p>
        </div>
      </section>

      <section class="card moon-badge" data-moon></section>

      <section class="card" data-holydays></section>

      <section class="card"><p><strong>Ingkel:</strong> <span data-ingkel>Ingkel Wong</span></p></section>

      <section class="card details-card" data-details role="button" aria-label="Buka detail hari"></section>

      <section class="nav-day">
        <button class="btn" type="button" data-prev>⬅️ Hari Sebelumnya</button>
        <button class="btn" type="button" data-next>Hari Berikutnya ➡️</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="active" type="button">Kalender</button>
      <button type="button">Cek Weton</button>
      <button type="button">Dewasa</button>
      <button type="button">Pencarian</button>
      <button type="button">Setting</button>
    </nav>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
